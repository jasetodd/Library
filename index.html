<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Library</title>
  </head>
  <body>
    <header>
      <img
        src="assets/janko-ferlic-sfL_QOnmy00-unsplash.jpg"
        alt=""
        srcset=""
      />
      <h1 class="heading">Library</h1>
    </header>

    <label for="drawer-toggle" class="drawerBtn"
      ><img src="assets/add_3145490.png" alt="Add book"
    /></label>
    <input type="checkbox" id="drawer-toggle" class="drawer-toggle" />
    <section class="add-book drawer">
      <img
        src="assets/janko-ferlic-sfL_QOnmy00-unsplash.jpg"
        alt=""
        srcset=""
      />
      <h2>Add new book</h2>

      <form action="">
        <div>
          <label for="name">Book Title:</label>
          <input type="text" id="title" name="name" />
        </div>
        <div>
          <label for="author">Author</label>
          <input type="text" id="author" name="author" />
        </div>
        <div>
          <label for="pages">Pages in book: </label>
          <input type="number" id="pages" name="pages" />
        </div>
        <div>
          <label for="read">Already read? </label>
          <input type="checkbox" id="read" name="read" />
        </div>
        <div><input type="button" value="Submit" id="submit" /></div>
      </form>
    </section>
    <main>
      <section class="library">
        <section class="add-book"></section>
        <section class="cards"></section>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
